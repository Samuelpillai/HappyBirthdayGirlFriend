<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        .container {
            transform: translateY(-5vh) !important;
        }
        h1 {
            font-size: 8.5rem !important;
            display: inline-block !important;
            margin: 0 auto 2rem auto !important;
        }
        .title-text {
            color: #b76e79 !important;
            background: linear-gradient(45deg, #b76e79, #e5b4b4, #ffd8d8, #b76e79) !important;
            -webkit-background-clip: text !important;
            -webkit-text-fill-color: transparent !important;
            text-shadow: 0 0 25px rgba(183, 110, 121, 0.4) !important;
        }
        .emoji {
            font-size: 8rem !important;
            -webkit-text-fill-color: initial !important;
            text-shadow: none !important;
        }
        @media (max-width: 768px) {
            h1 { font-size: 5rem !important; }
            .emoji { font-size: 4.8rem !important; }
        }
    </style>
</head>
<body>
    <div class="cursor"></div>
    <div class="container">
        <h1><span class="title-text">Happy Birthday Ancilla</span> <span class="emoji">💖</span></h1>
        <div class="greeting"></div>
        <button class="cta-button">Click to Enter Our World 💕</button>
    </div>

    <script src="script.js">
        
    </script>
</body>
</html>
